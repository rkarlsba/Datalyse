name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Linux runners have no Tk by default; macOS runners have it from
      # python.org builds and need nothing extra.
      - name: Install Tk (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Report the environment
        run: |
          python -c "import sys, platform; print(sys.version.split()[0], platform.platform())"
          python -c "import tkinter; print('Tk', tkinter.TkVersion)"
          python -c "import datalogger.platform_support as p; print(p.platform_notes())"

      # The twelve sample files and Datalyse.ini are deliberately not committed,
      # so the tests that need them skip with a stated reason. Everything else,
      # including the whole platform layer, runs everywhere.
      - name: Tests
        env:
          MPLBACKEND: Agg
        run: python -m pytest tests -q -rs

      # Constructing the GUI is the actual macOS regression test: it is what
      # would fail if a binding or a ttk call were not available on that Tk.
      - name: GUI constructs (X11)
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/gui_construct_check.py

      - name: GUI constructs (aqua)
        if: runner.os == 'macOS'
        run: python scripts/gui_construct_check.py

      - name: CLI runs
        env:
          MPLBACKEND: Agg
        run: |
          python -m datalogger --version
          python -m datalogger ports || true
