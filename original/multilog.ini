Multilog DB526 has a builtin table of more than 40 sensors. The last 10 are user-definable. The format is:

No.\title\unit\minimum value\maximum value

Datalyse reads this file (multilog.ini), when the device Multilog is selected, and Datalyse sorts the list by title. The numbers should not be changed, but otherwise the inifile is freely editable. Eg. it is possible to insert vernier-probes from no. 31 to 40.  