Everything below the first empty line is skipped!
Note, that each line is composed of: KEYWORD, SELECTION, EXPLANATION.
If the selection is empty or invalid, it is ignored.
Case is ignored.
Datalyse first looks for the ini-file in its own directory,
then on the C-drive. You can also insert a working directory,
the line looks like this:
PATH,C:\DATALYSE\
If a device is ON, it is displayed in the device menu in Datalyse.
If it is OFF, it is not displayed, e.g.:
DEVICE,64,OFF: Fluke 867B Multimeter, 25/6 1998
